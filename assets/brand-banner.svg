<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Collaborative Development Template — No gatekeepers. Just build.</title>
  <desc id="desc">A dark, high-contrast technology banner with electric-blue signal lines and an abstract anonymous-inspired emblem, representing independent creativity and human-AI collaboration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset=".56" stop-color="#0a1730"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28d7ff"/>
      <stop offset="1" stop-color="#7888ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#147bff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#147bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1000" cy="175" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#1b8dce" stroke-opacity=".36" stroke-width="2">
    <path d="M0 72h140l36 36h110M0 92h96l28 28h90M1200 58h-112l-38 38H930M1200 290h-160l-40-40H900"/>
    <path d="M70 360v-54l42-42h90M1120 0v42l-42 42h-70"/>
    <path d="M0 180h42l18-18h34M1200 180h-42l-18 18h-34" stroke-opacity=".22"/>
    <circle cx="286" cy="108" r="5" fill="#28d7ff"/><circle cx="930" cy="96" r="5" fill="#28d7ff"/>
    <circle cx="900" cy="250" r="5" fill="#28d7ff"/><circle cx="202" cy="264" r="5" fill="#28d7ff"/>
  </g>
  <g transform="translate(930 104)" filter="url(#softGlow)">
    <circle cx="86" cy="76" r="78" fill="#071326" stroke="url(#accent)" stroke-width="3"/>
    <path d="M30 70l24-17h64l24 17-24 17H54z" fill="none" stroke="#75e6ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M57 70h22M93 70h22" stroke="#75e6ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M86 18v-13M86 165v-13M8 76H-5M177 76h-13" stroke="#28d7ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 112h88M52 122h68" stroke="#7888ff" stroke-width="2" opacity=".65"/>
    <path d="M19 34l-10 8 10 8M153 34l10 8-10 8" fill="none" stroke="#28d7ff" stroke-width="2" opacity=".75"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="82" fill="#9ec9ef" font-size="20" font-weight="700" letter-spacing="6">INDEPENDENT MINDS. UNLIMITED BUILDS.</text>
    <text x="72" y="158" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-2">COLLABORATIVE</text>
    <text x="72" y="224" fill="url(#accent)" font-size="62" font-weight="800" letter-spacing="-2">DEVELOPMENT</text>
    <text x="76" y="260" fill="#ffffff" font-size="25" font-weight="700" letter-spacing="3">TEMPLATE</text>
    <rect x="76" y="278" width="610" height="3" rx="2" fill="url(#accent)"/>
    <text x="76" y="322" fill="#ffffff" font-size="27" font-weight="800" letter-spacing="1.5">NO GATEKEEPERS. JUST BUILD.</text>
  </g>
  <path d="M844 36l-22 42h22l-13 35 48-55h-27l17-22z" fill="#ffd34e"/>
  <path d="M1100 300h48M1124 288v24" stroke="#28d7ff" stroke-width="3" opacity=".8"/>
</svg>