name: Merge evidence gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  assurance:
    name: Five-lens merge evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate PR-specific assurance record
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/check_merge_evidence.py "$EVENT_PATH"
