name: Repository quality and security baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "work/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene and workflow policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run repository hygiene unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check repository hygiene
        run: python3 scripts/check_repo_hygiene.py

  recovery:
    name: Exact-head recovery dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history for exact PR base and head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply and reverse exact-base patch in a disposable worktree
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          base_tree="$(git rev-parse "${BASE_SHA}^{tree}")"
          head_tree="$(git rev-parse "${HEAD_SHA}^{tree}")"
          scratch="$(mktemp -d "$RUNNER_TEMP/pr-recovery.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          patch_file="$RUNNER_TEMP/pr-exact-head.patch"
          git diff --binary --full-index "$BASE_SHA" "$HEAD_SHA" -- > "$patch_file"
          test -s "$patch_file"
          git archive "$BASE_SHA" | tar -x -C "$scratch"
          git -C "$scratch" init -q
          git -C "$scratch" apply --check "$patch_file"
          git -C "$scratch" apply "$patch_file"
          git -C "$scratch" add --all
          actual_head="$(git -C "$scratch" write-tree)"
          if [[ "$actual_head" != "$head_tree" ]]; then
            echo "::error::Patch application did not reconstruct the exact PR head tree."
            exit 1
          fi
          git -C "$scratch" apply --reverse --check "$patch_file"
          git -C "$scratch" apply --reverse "$patch_file"
          git -C "$scratch" add --all
          actual_base="$(git -C "$scratch" write-tree)"
          if [[ "$actual_base" != "$base_tree" ]]; then
            echo "::error::Patch reversal did not restore the exact PR base tree."
            exit 1
          fi
          echo "Exact-base patch application and reversal reproduced both Git trees."

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prove pinned Gitleaks image detects a test secret
        run: |
          set -euo pipefail
          canary="$RUNNER_TEMP/gitleaks-canary"
          mkdir -p "$canary"
          prefix='ghp'
          body='0123456789abcdefghijABCDEFGHIJ012345'
          printf 'token = "%s_%s"\n' "$prefix" "$body" > "$canary/canary.go"
          scan_log="$RUNNER_TEMP/gitleaks-canary.log"
          if docker run --rm \
            --volume "$canary:/canary:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /canary --redact --no-banner > "$scan_log" 2>&1; then
            echo "::error::Pinned Gitleaks image did not detect the known test secret."
            exit 1
          fi
          if ! grep -Eq 'leaks found: [1-9][0-9]*' "$scan_log"; then
            echo "::error::Gitleaks canary exited non-zero without confirming a finding."
            exit 1
          fi
          echo "Gitleaks canary detected the known test secret."

      - name: Scan the complete pull-request commit range with Gitleaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'EOF'
          [extend]
          useDefault = true
          EOF
          mkdir "$RUNNER_TEMP/gitleaks-ignore"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          commit_count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
          if [[ "$commit_count" -lt 1 ]]; then
            echo "The exact pull-request range contains no commits; refusing to report a clean scan."
            exit 1
          fi
          echo "Scanning $commit_count commits in the exact pull-request range, including merge-commit first-parent diffs."
          scan_log="$RUNNER_TEMP/gitleaks.log"
          if ! docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/tmp/gitleaks.toml:ro" \
            --volume "$RUNNER_TEMP/gitleaks-ignore:/tmp/gitleaks-ignore:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="${BASE_SHA}..${HEAD_SHA} --diff-merges=first-parent" --config=/tmp/gitleaks.toml --gitleaks-ignore-path=/tmp/gitleaks-ignore --ignore-gitleaks-allow --redact --verbose . > "$scan_log" 2>&1; then
            echo "Gitleaks reported findings or failed; detailed scanner output is suppressed."
            exit 1
          fi
          scanned="$(grep -Eo '[1-9][0-9]* commits scanned' "$scan_log" | tail -n 1 || true)"
          if [[ -z "$scanned" ]]; then
            echo "Gitleaks did not confirm scanning any commits; refusing a clean result."
            exit 1
          fi
          echo "Gitleaks completed successfully: $scanned."

      - name: Scan pushed commits with Gitleaks
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'EOF'
          [extend]
          useDefault = true
          EOF
          mkdir "$RUNNER_TEMP/gitleaks-ignore"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            log_opts="--all"
          else
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${BEFORE_SHA}^{commit}"
            log_opts="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          git cat-file -e "${HEAD_SHA}^{commit}"
          scan_log="$RUNNER_TEMP/gitleaks.log"
          if ! docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/tmp/gitleaks.toml:ro" \
            --volume "$RUNNER_TEMP/gitleaks-ignore:/tmp/gitleaks-ignore:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="$log_opts --diff-merges=first-parent" --config=/tmp/gitleaks.toml --gitleaks-ignore-path=/tmp/gitleaks-ignore --ignore-gitleaks-allow --redact --verbose . > "$scan_log" 2>&1; then
            echo "Gitleaks reported findings or failed; detailed scanner output is suppressed."
            exit 1
          fi
          scanned="$(grep -Eo '[1-9][0-9]* commits scanned' "$scan_log" | tail -n 1 || true)"
          if [[ -z "$scanned" ]]; then
            echo "Gitleaks did not confirm scanning any commits; refusing a clean result."
            exit 1
          fi
          echo "Gitleaks completed successfully: $scanned."

      - name: Scan all available history with Gitleaks
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'EOF'
          [extend]
          useDefault = true
          EOF
          mkdir "$RUNNER_TEMP/gitleaks-ignore"
          scan_log="$RUNNER_TEMP/gitleaks.log"
          if ! docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/tmp/gitleaks.toml:ro" \
            --volume "$RUNNER_TEMP/gitleaks-ignore:/tmp/gitleaks-ignore:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--all --diff-merges=first-parent" --config=/tmp/gitleaks.toml --gitleaks-ignore-path=/tmp/gitleaks-ignore --ignore-gitleaks-allow --redact --verbose . > "$scan_log" 2>&1; then
            echo "Gitleaks reported findings or failed; detailed scanner output is suppressed."
            exit 1
          fi
          scanned="$(grep -Eo '[1-9][0-9]* commits scanned' "$scan_log" | tail -n 1 || true)"
          if [[ -z "$scanned" ]]; then
            echo "Gitleaks did not confirm scanning any commits; refusing a clean result."
            exit 1
          fi
          echo "Gitleaks completed successfully: $scanned."
