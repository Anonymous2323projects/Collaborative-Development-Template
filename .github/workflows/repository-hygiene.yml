name: Repository quality and security baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "work/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    name: Exact-head recovery rehearsal
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out both PR revisions without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact Git-tree patch and reversal
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/rehearse_pr_recovery.py --base "$BASE_SHA" --head "$HEAD_SHA"

  hygiene:
    name: Repository hygiene and workflow policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run repository hygiene unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check repository hygiene
        run: python3 scripts/check_repo_hygiene.py

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  recovery-windows:
    name: Windows recovery regression
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out PR candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use a fixed Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Check Git and run synthetic Windows regression suite
        shell: pwsh
        run: |
          git --version
          python --version
          python -m unittest discover -s tests -v
